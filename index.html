<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall NetOps AI - 萬用防火牆排錯與安全審計助理 (Conversational Pro)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b1120;
            --bg-card: #151f32;
            --bg-card-sub: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #24324d;
            --code-bg: #070a13;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 360px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px;
            gap: 12px;
            overflow-y: auto;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-icon {
            font-size: 24px;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border-radius: 8px;
            padding: 6px;
            display: inline-flex;
        }
        .brand-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
        .brand-subtitle { font-size: 0.72rem; color: var(--text-muted); }

        .vault-box {
            background-color: var(--bg-card-sub);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label {
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus { border-color: var(--primary); }

        .btn {
            background-color: var(--primary);
            color: #04101e;
            font-weight: 600;
            padding: 9px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-sm { padding: 5px 9px; font-size: 0.78rem; background-color: var(--border); color: #fff; }
        .btn-sm:hover { background-color: #334155; }
        .btn-accent { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            padding: 6px 10px;
            border-radius: 6px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #64748b; }
        .status-dot.connected { background-color: var(--success); }
        .status-dot.error { background-color: var(--accent); }

        .toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            cursor: pointer;
            padding: 4px 0;
        }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .chat-header {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background-color: rgba(21, 31, 50, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-actions { display: flex; gap: 8px; }

        .chat-container {
            flex: 1;
            padding: 18px 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message { display: flex; flex-direction: column; gap: 6px; max-width: 92%; }
        .message.user { align-self: flex-end; }
        .message.user .bubble {
            background-color: #0284c7;
            color: #fff;
            border-radius: 12px 12px 2px 12px;
            padding: 10px 16px;
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .message.assistant { align-self: flex-start; width: 100%; max-width: 98%; }

        .investigation-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        /* 摺疊式排錯歷程 (Collapsible Steps) */
        details.step-accordion {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        details.step-accordion summary {
            padding: 8px 12px;
            font-size: 0.82rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details.step-accordion summary:hover { color: var(--primary); }

        .step-timeline {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid var(--border);
        }

        .step-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background-color: #070a13;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.82rem;
        }

        .step-header { display: flex; justify-content: space-between; color: var(--primary); font-weight: 600; }
        .step-command {
            font-family: 'JetBrains Mono', monospace;
            background-color: #000;
            padding: 3px 6px;
            border-radius: 4px;
            color: #38bdf8;
            font-size: 0.78rem;
        }
        .step-preview {
            font-family: 'JetBrains Mono', monospace;
            background-color: #000;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #94a3b8;
            max-height: 110px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* 人性化報告對話框 */
        .report-box {
            background: linear-gradient(180deg, #18263e 0%, #0d1727 100%);
            border: 1px solid #38bdf866;
            border-radius: 10px;
            padding: 16px 20px;
            line-height: 1.7;
            font-size: 0.94rem;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.08);
        }
        .report-box h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .report-box ul, .report-box ol { padding-left: 20px; margin: 6px 0; }
        .report-box li { margin: 4px 0; }

        /* Input Bar */
        .input-bar-container {
            padding: 12px 20px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
        }
        .input-bar {
            display: flex;
            gap: 10px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 10px;
            align-items: center;
        }
        .input-bar:focus-within { border-color: var(--primary); }
        .input-bar textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.92rem;
            resize: none;
            outline: none;
            font-family: inherit;
            padding: 6px 0;
            max-height: 80px;
        }

        .quick-tags { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .tag-btn {
            background-color: var(--bg-card-sub);
            color: #94a3b8;
            border: 1px solid transparent;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
        }
        .tag-btn:hover { border-color: var(--primary); color: var(--primary); }

        .spinner {
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media print {
            .sidebar, .input-bar-container, .chat-header { display: none !important; }
            body, .main-content, .chat-container { height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; }
            .investigation-card { box-shadow: none !important; border: 1px solid #ccc !important; }
            .report-box { background: #fff !important; color: #000 !important; border: 1px solid #ccc !important; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon">🛡️</div>
            <div>
                <div class="brand-title">Firewall NetOps AI</div>
                <div class="brand-subtitle">資深網路工程師排錯對話助理</div>
            </div>
        </div>

        <div class="vault-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label>📚 快速載入設備</label>
                <button class="btn btn-sm" onclick="saveCurrentToVault()" title="儲存當前連線資訊">💾 存入</button>
            </div>
            <select id="savedDevicesSelect" onchange="loadSelectedDevice()">
                <option value="">-- 選擇已儲存設備 --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy...">
        </div>

        <div class="form-group">
            <label>設備名稱</label>
            <input type="text" id="devName" placeholder="例如: LAB PA">
        </div>

        <div class="form-group">
            <label>防火牆廠牌</label>
            <select id="deviceType">
                <option value="paloalto_panos">Palo Alto Networks (PAN-OS)</option>
                <option value="fortinet">Fortinet (FortiOS)</option>
            </select>
        </div>

        <div class="form-group">
            <label>防火牆 IP</label>
            <input type="text" id="host" placeholder="例如: 192.168.100.254">
        </div>

        <div style="display: flex; gap: 6px;">
            <div class="form-group" style="flex: 2;">
                <label>帳號 (Username)</label>
                <input type="text" id="username" placeholder="admin">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Port</label>
                <input type="number" id="port" value="22">
            </div>
        </div>

        <div class="form-group">
            <label>密碼 (Password)</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <label class="toggle-label">
            <span>🔒 本地機敏 IP 資料脫敏</span>
            <input type="checkbox" id="maskingToggle" checked>
        </label>

        <button class="btn btn-sm" id="btnTestConn" onclick="testConnection()">
            🔌 測試設備 SSH 連線
        </button>

        <button class="btn btn-accent btn-sm" onclick="triggerHealthAudit()">
            🛡️ 一鍵全設備安全與健康審計
        </button>

        <div class="status-badge" id="statusBadge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">尚未連線</span>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <div class="chat-header">
            <div>
                <b style="font-size: 0.95rem;">智能維運排錯對話</b>
                <span id="sessionTag" style="font-size: 0.75rem; color: var(--text-muted); margin-left: 8px;">Session: 新建對話</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-sm" onclick="exportReport()">📄 匯出維運報告</button>
                <button class="btn btn-sm" onclick="startNewSession()">🔄 新對話</button>
                <button class="btn btn-sm" onclick="clearChat()">🗑️ 清空</button>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="investigation-card">
                    <p style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.6;">
                        👋 您好！我是您的 <b>資深防火牆 NetOps 顧問</b>。<br>
                        不管是問 <b>「為什麼連不上？」</b> 還是 <b>「VPN 狀態正常嗎？」</b>，我會像真正的工程師一樣連入設備排查，並<b>直接告訴您問題結論與解決辦法</b>！
                    </p>
                </div>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="input-bar-container">
            <div class="quick-tags">
                <span style="font-size: 0.75rem; color: var(--text-muted); align-self: center;">快捷範例：</span>
                <button class="tag-btn" onclick="fillPrompt('為什麼 192.168.100.100 連不到 192.168.150.254？請直接告訴我結果與原因。')">🚫 為何連不到？</button>
                <button class="tag-btn" onclick="fillPrompt('目前 IPsec VPN 隧道狀態如何？Phase 1 與 Phase 2 有起來嗎？')">🔒 VPN 狀態排查</button>
                <button class="tag-btn" onclick="fillPrompt('為什麼介面在 14:00 會 down？請檢查實體層、光衰與事件日誌。')">🔌 介面為何 Down？</button>
                <button class="tag-btn" onclick="fillPrompt('請針對前述發現的問題，產生建議修復的 CLI 配置腳本。')">🛠️ 產生修復建議 CLI</button>
            </div>

            <div class="input-bar">
                <textarea id="promptInput" rows="2" placeholder="輸入排錯問題或直接追問... (Enter 送出, Shift+Enter 換行)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="btn" id="btnSend" onclick="submitInvestigation()">
                    <span>💬 送出對話</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = 'sess_' + Date.now();
        let isFirstQuestionInSession = true;
        let lastReportContent = '';

        window.onload = function() {
            loadVaultDevices();
        };

        function startNewSession() {
            currentSessionId = 'sess_' + Date.now();
            isFirstQuestionInSession = true;
            lastReportContent = '';
            document.getElementById('sessionTag').innerText = 'Session: ' + currentSessionId.slice(-6);
            clearChat();
        }

        async function loadVaultDevices() {
            try {
                const res = await fetch('/api/vault/devices');
                const list = await res.json();
                const sel = document.getElementById('savedDevicesSelect');
                sel.innerHTML = '<option value="">-- 選擇已儲存設備 --</option>';
                list.forEach((dev, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.innerText = `${dev.name || dev.host} (${dev.host})`;
                    sel.appendChild(opt);
                });
                window._cachedVault = list;
            } catch (e) {
                console.error(e);
            }
        }

        function loadSelectedDevice() {
            const idx = document.getElementById('savedDevicesSelect').value;
            if (idx === "" || !window._cachedVault) return;
            const dev = window._cachedVault[idx];
            if (!dev) return;
            document.getElementById('devName').value = dev.name || '';
            document.getElementById('deviceType').value = dev.device_type || 'paloalto_panos';
            document.getElementById('host').value = dev.host || '';
            document.getElementById('username').value = dev.username || '';
            document.getElementById('port').value = dev.port || 22;
            if (dev.password) document.getElementById('password').value = dev.password;
        }

        async function saveCurrentToVault() {
            const name = document.getElementById('devName').value.trim() || document.getElementById('host').value.trim();
            const host = document.getElementById('host').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const port = parseInt(document.getElementById('port').value.trim()) || 22;
            const device_type = document.getElementById('deviceType').value;

            if (!host) { alert('請填寫 IP 位址！'); return; }

            await fetch('/api/vault/devices', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, device_type, host, username, password, port })
            });
            alert('已將設備儲存至本機通訊錄！');
            loadVaultDevices();
        }

        function fillPrompt(text) {
            document.getElementById('promptInput').value = text;
            document.getElementById('promptInput').focus();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitInvestigation();
            }
        }

        function clearChat() {
            document.getElementById('chatContainer').innerHTML = '';
        }

        async function testConnection() {
            const host = document.getElementById('host').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const port = parseInt(document.getElementById('port').value.trim()) || 22;
            const deviceType = document.getElementById('deviceType').value;

            if (!host || !username) { alert('請填寫防火牆 IP 與管理員帳號！'); return; }

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const btn = document.getElementById('btnTestConn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 測試中...';

            try {
                const res = await fetch('/api/test-connection', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ device_type: deviceType, host, username, password, port })
                });
                const data = await res.json();
                if (data.success) {
                    dot.className = 'status-dot connected';
                    text.innerText = `連線成功 (${data.message})`;
                    text.style.color = '#34d399';
                } else {
                    dot.className = 'status-dot error';
                    text.innerText = `連線失敗: ${data.message}`;
                    text.style.color = '#f87171';
                }
            } catch (err) {
                dot.className = 'status-dot error';
                text.innerText = `請求異常: ${err.message}`;
                text.style.color = '#f87171';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔌 測試設備 SSH 連線';
            }
        }

        function triggerHealthAudit() {
            fillPrompt('請對目前防火牆執行「全設備安全與系統健康審計」。檢查 CPU 與記憶體狀態、Session 表健康度、路由健康狀況與是否有過度放行的 Any 規則，並給予繁體中文總結與評估。');
            submitInvestigation();
        }

        async function submitInvestigation() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            const apiKey = document.getElementById('apiKey').value.trim();
            const host = document.getElementById('host').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const port = parseInt(document.getElementById('port').value.trim()) || 22;
            const deviceType = document.getElementById('deviceType').value;
            const enableMasking = document.getElementById('maskingToggle').checked;

            if (!apiKey) { alert('請輸入 Gemini API Key！'); return; }
            if (!host || !username) { alert('請輸入防火牆 IP 與帳號！'); return; }

            document.getElementById('promptInput').value = '';
            const chat = document.getElementById('chatContainer');

            // 1. 使用者氣泡
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<div class="bubble">${escapeHtml(prompt)}</div>`;
            chat.appendChild(userMsg);

            // 2. AI 診斷卡片
            const assistantMsg = document.createElement('div');
            assistantMsg.className = 'message assistant';
            const cardId = 'card-' + Date.now();
            assistantMsg.innerHTML = `
                <div class="investigation-card" id="${cardId}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>🛡️ AI 顧問正在分析設備狀態...</b>
                        <span class="spinner" id="${cardId}-spinner"></span>
                    </div>

                    <!-- 摺疊式後台排錯歷程 -->
                    <details class="step-accordion" id="${cardId}-details" open>
                        <summary>🔍 查看 AI 調查過程與下達指令 (<span id="${cardId}-count">0</span> 次互動)</summary>
                        <div class="step-timeline" id="${cardId}-steps"></div>
                    </details>

                    <!-- 主要對話報告框 -->
                    <div class="report-box" id="${cardId}-report" style="display:none;"></div>
                </div>
            `;
            chat.appendChild(assistantMsg);
            chat.scrollTop = chat.scrollHeight;

            const btnSend = document.getElementById('btnSend');
            btnSend.disabled = true;

            const isFollowup = !isFirstQuestionInSession;
            isFirstQuestionInSession = false;

            try {
                const response = await fetch('/api/investigate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        api_key: apiKey,
                        device_type: deviceType,
                        host, username, password, port,
                        prompt,
                        enable_masking: enableMasking,
                        is_followup: isFollowup
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const rawJson = line.slice(6);
                            try {
                                const step = JSON.parse(rawJson);
                                renderStep(cardId, step);
                            } catch (e) {
                                console.error(e);
                            }
                        }
                    }
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (err) {
                renderStep(cardId, { type: 'error', content: err.message });
            } finally {
                btnSend.disabled = false;
                const sp = document.getElementById(`${cardId}-spinner`);
                if (sp) sp.style.display = 'none';
            }
        }

        let stepCounts = {};

        function renderStep(cardId, step) {
            const stepsContainer = document.getElementById(`${cardId}-steps`);
            const reportContainer = document.getElementById(`${cardId}-report`);
            const countSpan = document.getElementById(`${cardId}-count`);
            const detailsElem = document.getElementById(`${cardId}-details`);

            if (step.type === 'tool_call') {
                stepCounts[cardId] = (stepCounts[cardId] || 0) + 1;
                if (countSpan) countSpan.innerText = stepCounts[cardId];

                const item = document.createElement('div');
                item.className = 'step-item';
                item.id = `${cardId}-cmd-${step.command.replace(/[\s\.\-\/]/g, '_')}`;
                item.innerHTML = `
                    <div class="step-header">
                        <span>第 ${step.iteration} 輪：下達檢查指令</span>
                        <small style="color:var(--text-muted);">${escapeHtml(step.reason)}</small>
                    </div>
                    <div class="step-command">➜ ${escapeHtml(step.command)}</div>
                    <div class="step-preview" style="color:var(--text-muted);">正在讀取設備輸出...</div>
                `;
                stepsContainer.appendChild(item);
            } else if (step.type === 'tool_result') {
                const item = document.getElementById(`${cardId}-cmd-${step.command.replace(/[\s\.\-\/]/g, '_')}`);
                if (item) {
                    const preview = item.querySelector('.step-preview');
                    if (preview) preview.innerText = step.output_preview;
                }
            } else if (step.type === 'final_report') {
                // 自動將生硬的指令摺疊收起，把舞台留給 AI 的診斷對話
                if (detailsElem) detailsElem.removeAttribute('open');

                reportContainer.style.display = 'block';
                reportContainer.innerHTML = '<h3>💡 顧問診斷與故障分析報告</h3>' + formatMarkdown(step.content);
                lastReportContent = step.content;

                const sp = document.getElementById(`${cardId}-spinner`);
                if (sp) sp.style.display = 'none';
            } else if (step.type === 'error') {
                const item = document.createElement('div');
                item.className = 'step-item';
                item.style.borderColor = 'var(--accent)';
                item.innerHTML = `<span style="color:var(--accent);">❌ ${escapeHtml(step.content)}</span>`;
                stepsContainer.appendChild(item);
            }
        }

        function exportReport() {
            if (!lastReportContent) {
                alert('目前尚無診斷報告可供匯出，請先完成一輪排查！');
                return;
            }
            window.print();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let html = escapeHtml(text);
            html = html.replace(/^### (.*$)/gim, '<h4 style="color:#38bdf8;margin:8px 0;">$1</h4>');
            html = html.replace(/^## (.*$)/gim, '<h3 style="color:#38bdf8;margin:10px 0;">$1</h3>');
            html = html.replace(/^# (.*$)/gim, '<h2 style="color:#38bdf8;margin:12px 0;">$1</h2>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            html = html.replace(/`(.*?)`/g, '<code style="background:#000;color:#38bdf8;padding:2px 6px;border-radius:4px;">$1</code>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }
    </script>
</body>
</html>
